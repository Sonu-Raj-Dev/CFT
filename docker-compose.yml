version: '3.9'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: YourPassword@123
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourPassword@123 -Q "SELECT 1"
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - complaint_network

  # Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_SERVER: sqlserver
      DB_USER: sa
      DB_PASSWORD: YourPassword@123
      DB_DATABASE: ComplaintManagement
      DB_PORT: 1433
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      JWT_EXPIRY: 24h
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: debug
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    networks:
      - complaint_network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:5000
      NODE_ENV: development
    depends_on:
      - backend
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib
      - ./public:/app/public
      - /app/.next
      - /app/node_modules
    networks:
      - complaint_network
    restart: unless-stopped

networks:
  complaint_network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
